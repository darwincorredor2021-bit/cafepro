<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef5e9"/>
      <stop offset="0.55" stop-color="#d3e6cb"/>
      <stop offset="1" stop-color="#a9cd9f"/>
    </linearGradient>
    <radialGradient id="luz" cx="0.25" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-lejos" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9d6b0"/>
      <stop offset="1" stop-color="#9cc591"/>
    </linearGradient>
    <linearGradient id="g-medio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8dbd80"/>
      <stop offset="1" stop-color="#6aa55d"/>
    </linearGradient>
    <linearGradient id="g-cerca" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8f47"/>
      <stop offset="1" stop-color="#2f6b2e"/>
    </linearGradient>
    <linearGradient id="g-frente" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d6a2c"/>
      <stop offset="1" stop-color="#17401a"/>
    </linearGradient>
    <filter id="niebla" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <path id="surco" d="M-40 0 C300 -70 520 -10 800 -10 C1080 -10 1300 -90 1640 -30"
          fill="none" stroke="#1f5a22" stroke-opacity="0.55" stroke-width="12"
          stroke-linecap="round" stroke-dasharray="0 17"/>
  </defs>

  <rect width="1600" height="1000" fill="url(#cielo)"/>
  <rect width="1600" height="1000" fill="url(#luz)"/>

  <!-- Montañas lejanas -->
  <path d="M0 560 C150 430 260 420 400 500 C520 380 640 360 780 470 C900 400 1040 380 1180 470 C1320 400 1480 400 1600 480 V1000 H0Z"
        fill="url(#g-lejos)" opacity="0.75"/>
  <ellipse cx="500" cy="540" rx="520" ry="50" fill="#ffffff" opacity="0.75" filter="url(#niebla)"/>

  <!-- Colinas medias -->
  <path d="M0 650 C250 540 450 610 700 620 C950 630 1150 520 1350 560 C1480 585 1550 600 1600 590 V1000 H0Z"
        fill="url(#g-medio)"/>
  <ellipse cx="1100" cy="640" rx="560" ry="46" fill="#ffffff" opacity="0.6" filter="url(#niebla)"/>
  <use href="#surco" transform="translate(0 640)" opacity="0.5"/>
  <use href="#surco" transform="translate(0 672)" opacity="0.5"/>

  <!-- Colinas cercanas -->
  <path d="M0 770 C300 690 520 750 800 750 C1080 750 1300 670 1600 730 V1000 H0Z"
        fill="url(#g-cerca)"/>
  <use href="#surco" transform="translate(0 790)"/>
  <use href="#surco" transform="translate(0 826)"/>
  <use href="#surco" transform="translate(0 862)"/>

  <!-- Primer plano -->
  <path d="M0 900 C300 840 600 890 900 880 C1200 870 1400 820 1600 860 V1000 H0Z"
        fill="url(#g-frente)"/>
</svg>
