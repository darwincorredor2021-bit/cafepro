<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="lg1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a6b2a"/>
      <stop offset="1" stop-color="#5aa84a"/>
    </linearGradient>
    <linearGradient id="lg2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f8a35"/>
      <stop offset="1" stop-color="#86c46e"/>
    </linearGradient>
    <linearGradient id="lg3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b4d1f"/>
      <stop offset="1" stop-color="#3a8030"/>
    </linearGradient>
    <radialGradient id="cg" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ef5a46"/>
      <stop offset="0.6" stop-color="#c0261b"/>
      <stop offset="1" stop-color="#8a130f"/>
    </radialGradient>

    <g id="hoja">
      <path d="M0 0 C25 -38 100 -48 150 0 C100 48 25 38 0 0Z"/>
      <path d="M0 0 L142 0" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2.5" fill="none"/>
      <path d="M35 0 L70 -22 M35 0 L70 22 M70 0 L105 -18 M70 0 L105 18"
            stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.6" fill="none"/>
    </g>
    <g id="cereza">
      <circle r="14" fill="url(#cg)"/>
      <circle cx="-4.5" cy="-5" r="4" fill="#ffffff" opacity="0.4"/>
      <circle cx="0" cy="-12.5" r="3" fill="#4a1410"/>
    </g>
    <g id="flor">
      <g fill="#ffffff" stroke="#dfead8" stroke-width="1">
        <ellipse cx="0" cy="-15" rx="7.5" ry="15"/>
        <ellipse cx="0" cy="-15" rx="7.5" ry="15" transform="rotate(72)"/>
        <ellipse cx="0" cy="-15" rx="7.5" ry="15" transform="rotate(144)"/>
        <ellipse cx="0" cy="-15" rx="7.5" ry="15" transform="rotate(216)"/>
        <ellipse cx="0" cy="-15" rx="7.5" ry="15" transform="rotate(288)"/>
      </g>
      <circle r="4.5" fill="#f2c230"/>
    </g>
  </defs>

  <!-- Hojas grandes de fondo -->
  <use href="#hoja" transform="translate(-10 610) rotate(-38) scale(2.3)" fill="url(#lg3)"/>
  <use href="#hoja" transform="translate(-10 520) rotate(-18) scale(2.0)" fill="url(#lg3)"/>
  <use href="#hoja" transform="translate(40 600) rotate(-62) scale(1.8)" fill="url(#lg1)"/>

  <!-- Tallo -->
  <path d="M-10 612 C120 520 230 430 345 325" fill="none" stroke="#5b3a1e" stroke-width="8" stroke-linecap="round"/>

  <!-- Hojas sobre el tallo -->
  <use href="#hoja" transform="translate(70 545) rotate(-80) scale(1.1)" fill="url(#lg2)"/>
  <use href="#hoja" transform="translate(80 535) rotate(-8) scale(1.1)" fill="url(#lg1)"/>
  <use href="#hoja" transform="translate(130 490) rotate(-88) scale(1.05)" fill="url(#lg1)"/>
  <use href="#hoja" transform="translate(140 482) rotate(10) scale(1.1)" fill="url(#lg2)"/>
  <use href="#hoja" transform="translate(195 430) rotate(-78) scale(1.0)" fill="url(#lg2)"/>
  <use href="#hoja" transform="translate(205 424) rotate(-12) scale(1.05)" fill="url(#lg1)"/>
  <use href="#hoja" transform="translate(255 380) rotate(-66) scale(0.95)" fill="url(#lg1)"/>
  <use href="#hoja" transform="translate(262 374) rotate(12) scale(0.95)" fill="url(#lg2)"/>
  <use href="#hoja" transform="translate(310 345) rotate(-48) scale(0.85)" fill="url(#lg2)"/>
  <use href="#hoja" transform="translate(340 328) rotate(-22) scale(0.85)" fill="url(#lg1)"/>

  <!-- Cerezas -->
  <g stroke="#6b4423" stroke-width="2" fill="none">
    <path d="M150 505 L146 540"/>
    <path d="M165 495 L178 535"/>
    <path d="M110 520 L100 560"/>
    <path d="M225 440 L232 480"/>
  </g>
  <use href="#cereza" transform="translate(145 548)"/>
  <use href="#cereza" transform="translate(180 544) scale(0.95)"/>
  <use href="#cereza" transform="translate(162 566) scale(0.9)"/>
  <use href="#cereza" transform="translate(99 568) scale(1.05)"/>
  <use href="#cereza" transform="translate(232 488)"/>
  <use href="#cereza" transform="translate(252 478) scale(0.9)"/>

  <!-- Flores -->
  <use href="#flor" transform="translate(300 290) scale(1.25)"/>
  <use href="#flor" transform="translate(262 330) rotate(20) scale(1.0)"/>
  <use href="#flor" transform="translate(345 275) rotate(40) scale(0.85)"/>
  <use href="#flor" transform="translate(60 470) rotate(10) scale(0.9)"/>
